<div id="tabGrades" class="hidden">
          <div class="card" style="background:var(--panel-2);">
            <h3>Baho va davomat yozish (10 ballik tizim)</h3>
            <form id="addRecordForm" class="grid-2">
              <div class="field"><label>O‘quvchi</label><select id="recStudent"></select></div>
              <div class="field"><label>Fan / mavzu</label><input type="text" id="recSubject" required placeholder="Ingliz tili / Matematika" /></div>
              <div class="field"><label>Baho (1 dan 10 gacha)</label><input type="number" id="recScore" required min="1" max="10" placeholder="1 - 10" /></div>
              <div class="field">
                <label>Davomat</label>
                <select id="recAtt">
                  <option value="Keldi">Keldi</option>
                  <option value="Kelmadi">Kelmadi</option>
                  <option value="Kechikdi">Kechikdi</option>
                </select>
              </div>
              <button type="submit" class="btn-sky">Saqlash</button>
            </form>
          </div>
          <div class="grid-2">
            <div>
              <h3>Umumiy o‘quvchilar reytingi</h3>
              <table>
                <thead><tr><th>#</th><th>O‘quvchi</th><th>Jami / O‘rtacha (10)</th><th>Keldi</th></tr></thead>
                <tbody id="ratingTbody"></tbody>
              </table>
            </div>
            <div>
              <h3>Barcha baholar</h3>
              <table>
                <thead><tr><th>O‘quvchi</th><th>Fan</th><th>Baho (10)</th><th>Davomat</th></tr></thead>
                <tbody id="recordsTbody"></tbody>
              </table>
            </div>
          </div>
        </div>

        <!-- Tab 3: Logo -->
        <div id="tabBrand" class="hidden">
          <div class="grid-2">
            <div class="field"><label>Markaz nomi</label><input type="text" id="brandNameInput" /></div>
            <div class="field"><label>Logo URL yoki fayl</label><input type="text" id="brandUrlInput" placeholder="https://..." /></div>
          </div>
          <div class="actions" style="margin-top:8px;">
            <input type="file" id="brandFileInput" accept="image/*" />
            <button id="saveBrandBtn" class="btn-ok">Logoni va nomni saqlash</button>
