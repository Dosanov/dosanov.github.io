<!DOCTYPE html>
<html lang="uz">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Baho va Davomat Tizimi</title>
  <style>
    :root {
      --bg: #f4f7fb;
      --card: #ffffff;
      --text: #0f172a;
      --muted: #64748b;
      --primary: #2563eb;
      --primary-hover: #1d4ed8;
      --border: #e2e8f0;
      --success-bg: #dcfce7;
      --success-text: #166534;
      --danger-bg: #fee2e2;
      --danger-text: #991b1b;
      --radius: 14px;
      --shadow: 0 10px 25px -5px rgba(15, 23, 42, 0.06), 0 4px 10px -2px rgba(15, 23, 42, 0.04);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Inter, Arial, sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.5;
      padding: 20px 14px 48px;
    }

    .container {
      max-width: 1040px;
      margin: 0 auto;
    }

    .topbar {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 16px 20px;
      box-shadow: var(--shadow);
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 14px;
      margin-bottom: 20px;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .brand-logo {
      width: 46px;
      height: 46px;
      border-radius: 12px;
      object-fit: cover;
      border: 1px solid var(--border);
      background: #eff6ff;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 700;
      color: var(--primary);
      font-size: 18px;
      flex-shrink: 0;
    }

    .brand-title {
      font-size: 18px;
      font-weight: 700;
    }

    .brand-sub {
      font-size: 13px;
      color: var(--muted);
    }

    .status-badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: var(--success-bg);
      color: var(--success-text);
      padding: 6px 12px;
      border-radius: 999px;
      font-size: 13px;
      font-weight: 600;
    }

    .grid-2 {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
      gap: 18px;
      margin-bottom: 20px;
    }

    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 20px;
      box-shadow: var(--shadow);
      margin-bottom: 20px;
    }

    .grid-2 .card {
      margin-bottom: 0;
    }

    h2, h3 {
      font-size: 16px;
      font-weight: 700;
      margin-bottom: 14px;
    }

    .field {
      margin-bottom: 12px;
    }

    label {
      display: block;
      font-size: 13px;
      font-weight: 600;
      color: #334155;
      margin-bottom: 5px;
    }

    input, select {
      width: 100%;
      padding: 10px 12px;
      border: 1px solid var(--border);
      border-radius: 10px;
      font-size: 14px;
      color: var(--text);
      background: #fff;
      outline: none;
      transition: border-color 0.15s, box-shadow 0.15s;
    }

    input:focus, select:focus {
      border-color: var(--primary);
      box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.15);
    }

    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      padding: 10px 16px;
      border: none;
      border-radius: 10px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.15s, transform 0.05s;
    }

    .btn:active {
      transform: scale(0.99);
    }

    .btn-primary {
      background: var(--primary);
      color: #fff;
      width: 100%;
    }

    .btn-primary:hover {
      background: var(--primary-hover);
    }

    .btn-danger {
      background: var(--danger-bg);
      color: var(--danger-text);
      padding: 5px 10px;
      font-size: 12px;
      border-radius: 8px;
    }

    .table-wrap {
      overflow-x: auto;
    }
[24/11/26 12:07] Hadicha: table {
      width: 100%;
      border-collapse: collapse;
      font-size: 14px;
    }

    th, td {
      padding: 10px 12px;
      text-align: left;
      border-bottom: 1px solid var(--border);
      white-space: nowrap;
    }

    th {
      background: #f8fafc;
      color: #475569;
      font-weight: 600;
      font-size: 13px;
    }

    .pill-keldi {
      background: var(--success-bg);
      color: var(--success-text);
      padding: 3px 8px;
      border-radius: 999px;
      font-size: 12px;
      font-weight: 600;
    }

    .pill-kelmadi {
      background: var(--danger-bg);
      color: var(--danger-text);
      padding: 3px 8px;
      border-radius: 999px;
      font-size: 12px;
      font-weight: 600;
    }

    .empty {
      color: var(--muted);
      font-size: 14px;
      padding: 8px 0;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="topbar">
      <div class="brand">
        <img id="logoPreview" class="brand-logo" alt="Logo" style="display:none;" />
        <div id="logoFallback" class="brand-logo">DA</div>
        <div>
          <div id="centerTitle" class="brand-title">O‘quv Markazi</div>
          <div class="brand-sub">Baho va davomat boshqaruv paneli</div>
        </div>
      </div>
      <div class="status-badge">Onlayn ✓</div>
    </div>

    <div class="grid-2">
      <div class="card">
        <h2>Baho va davomat yozish (10 ballik tizim)</h2>
        <form id="gradeForm">
          <div class="field">
            <label for="studentName">O‘quvchi</label>
            <input type="text" id="studentName" list="studentsList" placeholder="Masalan: Ali Valiyev" required />
            <datalist id="studentsList"></datalist>
          </div>

          <div class="field">
            <label for="subjectName">Fan / mavzu</label>
            <input type="text" id="subjectName" placeholder="Ingliz tili / Matematika" required />
          </div>

          <div class="field">
            <label for="scoreInput">Baho (1 dan 10 gacha)</label>
            <input type="number" id="scoreInput" min="1" max="10" placeholder="1 - 10" required />
          </div>

          <div class="field">
            <label for="attendanceSelect">Davomat</label>
            <select id="attendanceSelect">
              <option value="Keldi">Keldi</option>
              <option value="Kelmadi">Kelmadi</option>
            </select>
          </div>

          <button type="submit" class="btn btn-primary">Saqlash</button>
        </form>
      </div>

      <div class="card">
        <h2>Markaz sozlamalari</h2>
        <div class="field">
          <label for="brandNameInput">Markaz nomi</label>
          <input type="text" id="brandNameInput" placeholder="Markaz nomini kiriting" />
        </div>

        <div class="field">
          <label for="brandUrlInput">Logo URL yoki fayl</label>
          <input type="text" id="brandUrlInput" placeholder="https://..." />
        </div>

        <div class="field">
          <label for="brandFileInput">Yoki rasm fayl tanlang</label>
          <input type="file" id="brandFileInput" accept="image/*" />
        </div>

        <button type="button" id="saveBrandBtn" class="btn btn-primary">Logoni va nomni saqlash</button>
      </div>
    </div>

    <div class="card">
      <h3>Umumiy o‘quvchilar reytingi</h3>
      <div class="table-wrap">
        <table>
          <thead>
            <tr>
              <th>#</th>
              <th>O‘quvchi</th>
              <th>Jami</th>
              <th>O‘rtacha (10)</th>
              <th>Keldi</th>
            </tr>
          </thead>
          <tbody id="ratingBody"></tbody>
        </table>
      </div>
    </div>

    <div class="card">
      <h3>Barcha baholar</h3>
      <div class="table-wrap">
        <table>
          <thead>
[24/11/26 12:07] Hadicha: <tr>
              <th>O‘quvchi</th>
              <th>Fan</th>
              <th>Baho (10)</th>
              <th>Davomat</th>
              <th>Amal</th>
            </tr>
          </thead>
          <tbody id="gradesBody"></tbody>
        </table>
      </div>
    </div>
  </div>

  <script>
    const STORAGE_GRADES = "dosanov_grades_v1";
    const STORAGE_BRAND = "dosanov_brand_v1";

    let grades = JSON.parse(localStorage.getItem(STORAGE_GRADES) || "[]");
    let brand = JSON.parse(localStorage.getItem(STORAGE_BRAND) || '{"name":"O‘quv Markazi","logo":""}');

    const centerTitle = document.getElementById("centerTitle");
    const brandNameInput = document.getElementById("brandNameInput");
    const brandUrlInput = document.getElementById("brandUrlInput");
    const brandFileInput = document.getElementById("brandFileInput");
    const logoPreview = document.getElementById("logoPreview");
    const logoFallback = document.getElementById("logoFallback");
    const saveBrandBtn = document.getElementById("saveBrandBtn");

    const gradeForm = document.getElementById("gradeForm");
    const studentNameInput = document.getElementById("studentName");
    const subjectNameInput = document.getElementById("subjectName");
    const scoreInput = document.getElementById("scoreInput");
    const attendanceSelect = document.getElementById("attendanceSelect");
    const ratingBody = document.getElementById("ratingBody");
    const gradesBody = document.getElementById("gradesBody");
    const studentsList = document.getElementById("studentsList");

    function renderBrand() {
      const name = brand.name || "O‘quv Markazi";
      centerTitle.textContent = name;
      brandNameInput.value = name;
      brandUrlInput.value = brand.logo && !brand.logo.startsWith("data:") ? brand.logo : "";

      if (brand.logo) {
        logoPreview.src = brand.logo;
        logoPreview.style.display = "block";
        logoFallback.style.display = "none";
      } else {
        logoPreview.style.display = "none";
        logoFallback.style.display = "flex";
        logoFallback.textContent = name.slice(0, 2).toUpperCase();
      }
    }

    brandFileInput.addEventListener("change", (e) => {
      const file = e.target.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = () => {
        brand.logo = reader.result;
        localStorage.setItem(STORAGE_BRAND, JSON.stringify(brand));
        renderBrand();
      };
      reader.readAsDataURL(file);
    });

    saveBrandBtn.addEventListener("click", () => {
      const newName = brandNameInput.value.trim() || "O‘quv Markazi";
      const newUrl = brandUrlInput.value.trim();
      brand.name = newName;
      if (newUrl) {
        brand.logo = newUrl;
      }
      localStorage.setItem(STORAGE_BRAND, JSON.stringify(brand));
      renderBrand();
    });

    function renderAll() {
      localStorage.setItem(STORAGE_GRADES, JSON.stringify(grades));

      const uniqueStudents = [...new Set(grades.map(g => g.student))];
      studentsList.innerHTML = uniqueStudents.map(s => <option value="${escapeHtml(s)}"></option>).join("");

      if (grades.length === 0) {
        ratingBody.innerHTML = <tr><td colspan="5" class="empty">Hali ma’lumot kiritilmagan.</td></tr>;
        gradesBody.innerHTML = <tr><td colspan="5" class="empty">Hali baholar yo‘q.</td></tr>;
        return;
      }

      const statsMap = {};
      for (const item of grades) {
        if (!statsMap[item.student]) {
          statsMap[item.student] = { student: item.student, total: 0, count: 0, present: 0 };
        }
        statsMap[item.student].total += Number(item.score);
        statsMap[item.student].count += 1;
        if (item.attendance === "Keldi") statsMap[item.student].present += 1;
      }
[24/11/26 12:07] Hadicha: const ranked = Object.values(statsMap).sort((a, b) => (b.total / b.count) - (a.total / a.count));
      ratingBody.innerHTML = ranked.map((r, idx) => {
        const avg = (r.total / r.count).toFixed(1);
        return 
          <tr>
            <td>${idx + 1}</td>
            <td><strong>${escapeHtml(r.student)}</strong></td>
            <td>${r.total}</td>
            <td>${avg}</td>
            <td>${r.present}</td>
          </tr>
        ;
      }).join("");

      gradesBody.innerHTML = grades.map((g, index) => {
        const badgeClass = g.attendance === "Keldi" ? "pill-keldi" : "pill-kelmadi";
        return 
          <tr>
            <td>${escapeHtml(g.student)}</td>
            <td>${escapeHtml(g.subject)}</td>
            <td><strong>${g.score}</strong></td>
            <td><span class="${badgeClass}">${escapeHtml(g.attendance)}</span></td>
            <td><button class="btn btn-danger" onclick="deleteGrade(${index})">O‘chirish</button></td>
          </tr>
        ;
      }).join("");
    }

    gradeForm.addEventListener("submit", (e) => {
      e.preventDefault();
      const student = studentNameInput.value.trim();
      const subject = subjectNameInput.value.trim();
      const score = Number(scoreInput.value);
      const attendance = attendanceSelect.value;

      if (!student  !subject  score < 1 || score > 10) return;

      grades.unshift({ student, subject, score, attendance });
      renderAll();

      subjectNameInput.value = "";
      scoreInput.value = "";
    });

    window.deleteGrade = function(index) {
      grades.splice(index, 1);
      renderAll();
    };

    function escapeHtml(str) {
      return String(str)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;");
    }

    renderBrand();
    renderAll();
  </script>
</body>
</html>
