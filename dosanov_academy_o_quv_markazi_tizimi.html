    function loadDB() {
      const saved = localStorage.getItem(STORAGE_KEY);
      if (saved) {
        try {
          const parsed = JSON.parse(saved);
          if (!parsed.subjects) parsed.subjects = [];
          if (!parsed.groups) parsed.groups = [];
          if (!parsed.users) parsed.users = JSON.parse(JSON.stringify(DEFAULT_DB.users));
          return parsed;
        } catch (e) {
          console.error('Bazani o\'qishda xatolik:', e);
        }
      }
      localStorage.setItem(STORAGE_KEY, JSON.stringify(DEFAULT_DB));
      return JSON.parse(JSON.stringify(DEFAULT_DB));
    }

    function saveDB() {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(db));
    }

    // ==================== LOGO YUKLASH VA KO'RSATISH ====================
    function applySavedLogo() {
      const savedLogo = localStorage.getItem(LOGO_STORAGE_KEY);
      const loginImg = document.getElementById('academy-logo');
      const loginPlaceholder = document.getElementById('academy-logo-placeholder');
      const sidebarImg = document.getElementById('sidebar-logo');
      const sidebarFallback = document.getElementById('sidebar-logo-fallback');
      const mobileImg = document.getElementById('mobile-header-logo');
      const mobileFallback = document.getElementById('mobile-header-logo-fallback');

      if (savedLogo) {
        if (loginImg) { loginImg.src = savedLogo; loginImg.classList.remove('hidden'); }
        if (loginPlaceholder) loginPlaceholder.classList.add('hidden');
        if (sidebarImg) { sidebarImg.src = savedLogo; sidebarImg.classList.remove('hidden'); }
        if (sidebarFallback) sidebarFallback.classList.add('hidden');
        if (mobileImg) { mobileImg.src = savedLogo; mobileImg.classList.remove('hidden'); }
        if (mobileFallback) mobileFallback.classList.add('hidden');
      }
    }

    function handleLogoUpload(event) {
      const file = event.target.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = function (e) {
        const dataUrl = e.target.result;
        try {
          localStorage.setItem(LOGO_STORAGE_KEY, dataUrl);
          applySavedLogo();
          showToast("Akademiya logosi muvaffaqiyatli yangilandi!", "success");
        } catch (err) {
          showToast("Rasm hajmi juda katta, kichikroq rasm tanlang.", "error");
        }
      };
      reader.readAsDataURL(file);
    }

    function formatMoney(amount) {
      return amount.toString().replace(/\B(?=(\d{3})+(?!\d))/g, " ") + " so'm";
    }

    function getGroupInfo(groupId) {
      if (!groupId) return 'Guruh biriktirilmagan';
      const g = db.groups.find(item => item.id === groupId);
      if (!g) return 'Guruh topilmadi';
      return g.subject ? `${g.name} (${g.subject})` : g.name;
    }

    function getGroupName(groupId) {
      return getGroupInfo(groupId);
    }

    function calculateStudentRating(student) {
      const grades = student.grades || [];
      const attendance = student.attendance || [];
      const avgGrade = grades.length > 0
        ? grades.reduce((sum, g) => sum + Number(g.score), 0) / grades.length
        : 0;
      const presentCount = attendance.filter(a => a.status === 'Keldi').length;
      const attRate = attendance.length > 0 ? (presentCount / attendance.length) * 100 : 100;
      // Reyting ball: 80% o'rtacha baho + 20% davomat foizi
      const ratingScore = Math.round((avgGrade * 0.8 + attRate * 0.2) * 10) / 10;
      return {
        avgGrade: Math.round(avgGrade * 10) / 10,
        attRate: Math.round(attRate),
        ratingScore
      };
    }

    function getRankedStudents(groupId = null) {
      let students = db.users.filter(u => u.role === 'oquvchi');
      if (groupId && groupId !== 'all') {
        students = students.filter(s => s.groupId === groupId);
      }
      return students
        .map(s => ({
          ...s,
          stats: calculateStudentRating(s)
        }))
        .sort((a, b) => b.stats.ratingScore - a.stats.ratingScore);
    }

    function showToast(message, type = 'info') {
      const container = document.getElementById('toast-container');
      const toast = document.createElement('div');
      const colors = {
        success: 'bg-emerald-950/95 border-emerald-500/50 text-emerald-200',
        error: 'bg-red-950/95 border-red-500/50 text-red-200',
        info: 'bg-slate-900/95 border-slate-600/50 text-slate-200'
      };
      const icons = {
        success: 'fa-circle-check text-emerald-400',
        error: 'fa-circle-exclamation text-red-400',
        info: 'fa-circle-info text-amber-400'
      };

      toast.className = `pointer-events-auto flex items-center gap-3 px-4 py-3.5 rounded-2xl border shadow-2xl backdrop-blur-md text-sm font-medium transform transition-all duration-300 translate-x-0 ${colors[type] || colors.info}`;
      toast.innerHTML = `
        <i class="fa-solid ${icons[type] || icons.info} text-base"></i>
        <span>${message}</span>
      `;
      container.appendChild(toast);
      setTimeout(() => {
        toast.classList.add('opacity-0', 'translate-x-5');
        setTimeout(() => toast.remove(), 300);
      }, 3200);
    }

    function showConfirm(title, message, onConfirm) {
      const modal = document.getElementById('confirm-modal');
      document.getElementById('confirm-title').textContent = title;
      document.getElementById('confirm-message').textContent = message;
      modal.classList.remove('hidden');
      modal.classList.add('flex');

      const okBtn = document.getElementById('confirm-ok-btn');
      const cancelBtn = document.getElementById('confirm-cancel-btn');

      const cleanup = () => {
        modal.classList.add('hidden');
        modal.classList.remove('flex');
      };

      okBtn.onclick = () => {
        cleanup();
        onConfirm();
      };
      cancelBtn.onclick = cleanup;
    }

        icon.classList.replace('fa-eye', 'fa-eye-slash');

      e.preventDefault();
      const username = document.getElementById('login-username').value.trim();
      const password = document.getElementById('login-password').value.trim();

      const user = db.users.find(u => u.username === username && u.password === password);

    function switchTab(tabId) {
      activeTab = tabId;
      document.querySelectorAll('.nav-item').forEach(btn => {

          btn.classList.add('bg-emerald-600', 'text-white', 'shadow-lg', 'shadow-emerald-600/20');

          btn.classList.remove('bg-emerald-600', 'text-white', 'shadow-lg', 'shadow-emerald-600/20');
          btn.classList.add('text-slate-400', 'hover:bg-white/5');
        }
      });

      const sidebar = document.getElementById('sidebar');
      if (!sidebar.classList.contains('-translate-x-full') && window.innerWidth < 1024) {
        toggleMobileSidebar();
      }

      renderActiveTab();
    }

    function toggleNewUserAssignmentField() {
      const role = document.getElementById('new-user-role').value;
      const groupWrapper = document.getElementById('new-user-group-wrapper');
      const subjectWrapper = document.getElementById('new-user-subject-wrapper');
      if (role === 'oquvchi') {
        groupWrapper.classList.remove('hidden', 'opacity-40', 'pointer-events-none');
        subjectWrapper.classList.add('hidden');
      } else if (role === 'ustoz') {
        groupWrapper.classList.add('hidden');
        subjectWrapper.classList.remove('hidden');
      } else {
        groupWrapper.classList.remove('hidden');
        groupWrapper.classList.add('opacity-40', 'pointer-events-none');
        subjectWrapper.classList.add('hidden');
      }
    }

    function handleAddUser(e) {
      e.preventDefault();
      const name = document.getElementById('new-user-name').value.trim();
      const role = document.getElementById('new-user-role').value;
      const groupId = document.getElementById('new-user-group').value;
      const subject = document.getElementById('new-user-subject').value;
      const username = document.getElementById('new-user-username').value.trim();
      const password = document.getElementById('new-user-password').value.trim();

      if (db.users.some(u => u.username.toLowerCase() === username.toLowerCase())) {
        showToast("Bu login band! Boshqa login tanlang.", "error");
        return;
      }

      const newUser = {
        id: 'u_' + Date.now(),
        name,
        username,
        password,
        role
      };

      if (role === 'oquvchi') {
        newUser.groupId = groupId || '';
        newUser.paid = false;
        newUser.paidDate = null;
        newUser.grades = [];
        newUser.attendance = [];
      } else if (role === 'ustoz') {
        newUser.subject = subject || '';
      }

      db.users.push(newUser);
      saveDB();
      showToast(`${name} tizimga muvaffaqiyatli qo'shildi!`, "success");
      renderActiveTab();
    }

    function reassignStudentGroup(studentId, newGroupId) {
      const student = db.users.find(u => u.id === studentId);
      if (!student) return;
      student.groupId = newGroupId;
      saveDB();
      showToast(`${student.name} guruhi yangilandi!`, "success");
    }

    function deleteUser(userId) {
      const target = db.users.find(u => u.id === userId);
      if (!target) return;
      showConfirm(
        "Foydalanuvchini o'chirish",
        `"${target.name}" ni tizimdan butunlay chiqarib yuborishni tasdiqlaysizmi?`,
        () => {
          db.users = db.users.filter(u => u.id !== userId);
          saveDB();
          showToast(`${target.name} tizimdan o'chirildi.`, "info");
          renderActiveTab();
        }
      );
    }

    function saveStudentEvaluation(studentId) {
      const student = db.users.find(u => u.id === studentId);
      if (!student) return;

      const date = document.getElementById('teacher-lesson-date').value || new Date().toISOString().split('T')[0];
      const attStatus = document.getElementById(`att-${studentId}`).value;
      const gradeVal = document.getElementById(`grade-${studentId}`).value;
      const topicVal = document.getElementById(`topic-${studentId}`).value.trim() || 'Dars bahosi';

      student.attendance = student.attendance || [];
      student.attendance.push({ date, status: attStatus });

      if (gradeVal !== '') {
        const numericScore = Number(gradeVal);
        if (isNaN(numericScore) || numericScore < 0 || numericScore > 100) {
          showToast("Baho 0 dan 100 gacha bo'lishi kerak!", "error");
          return;
        }
        student.grades = student.grades || [];
        student.grades.push({ date, score: numericScore, topic: topicVal });
      }

      saveDB();
      showToast(`${student.name} uchun davomat (${attStatus}) ${gradeVal !== '' ? 'va baho (' + gradeVal + ')' : ''} saqlandi!`, "success");
      renderActiveTab();
    }

                    <span class="text-sm text-slate-200 font-medium">${a.date}</span>
                    ${a.status === 'Keldi'
                      ? '<span class="px-3 py-1 rounded-lg bg-emerald-500/15 text-emerald-400 text-xs font-bold">✅ Keldi</span>'
                      : '<span class="px-3 py-1 rounded-lg bg-red-500/15 text-red-400 text-xs font-bold">❌ Kelmadi</span>'
                    }
                  </div>
                `).join('')
              }
            </div>
          </div>
        </div>
      `;
    }

    // ==================== REYTING JADVALI (GURUH VA MARKAZ BO'YICHA) ====================
    function renderRatingsView(isStudentView) {
      const me = isStudentView ? db.users.find(u => u.id === currentUser.id) : null;
      if (isStudentView && ratingFilterMode === 'group' && me) {
        ratingSelectedGroup = me.groupId;
      }

      const rankedList = ratingFilterMode === 'center'
        ? getRankedStudents('all')
        : getRankedStudents(ratingSelectedGroup === 'all' && db.groups[0] ? db.groups[0].id : ratingSelectedGroup);

      return `
        <!-- Filtr tugmalari: Markaz bo'yicha / Guruh bo'yicha -->
        <div class="p-5 rounded-2xl bg-cardbg border border-borderdark flex flex-col sm:flex-row sm:items-center justify-between gap-4">
          <div class="flex flex-wrap items-center gap-2">
            <button onclick="setRatingMode('center')" class="px-4 py-2.5 rounded-xl text-xs font-bold transition flex items-center gap-2 ${ratingFilterMode === 'center' ? 'bg-indigo-600 text-white shadow-lg shadow-indigo-600/25' : 'bg-darkbg text-slate-400 hover:text-white border border-borderdark'}">
              <i class="fa-solid fa-building-columns"></i>
              <span>Markaz bo'yicha reyting</span>
            </button>
            <button onclick="setRatingMode('group')" class="px-4 py-2.5 rounded-xl text-xs font-bold transition flex items-center gap-2 ${ratingFilterMode === 'group' ? 'bg-indigo-600 text-white shadow-lg shadow-indigo-600/25' : 'bg-darkbg text-slate-400 hover:text-white border border-borderdark'}">
              <i class="fa-solid fa-users"></i>
              <span>Guruh bo'yicha reyting</span>
            </button>
          </div>

          ${ratingFilterMode === 'group' ? `
            <div class="flex items-center gap-2">
              <span class="text-xs text-slate-400">Guruh:</span>
              <select onchange="changeRatingGroup(this.value)" class="px-3.5 py-2 rounded-xl bg-darkbg border border-borderdark text-white text-xs font-semibold">
                ${db.groups.map(g => `<option value="${g.id}" ${g.id === (ratingSelectedGroup === 'all' ? db.groups[0]?.id : ratingSelectedGroup) ? 'selected' : ''}>${g.name}</option>`).join('')}
              </select>
            </div>
          ` : `
            <div class="flex items-center gap-4 text-xs font-semibold">
              <span class="flex items-center gap-1.5 text-emerald-400"><span class="w-2.5 h-2.5 rounded-full bg-emerald-500"></span> To'lagan (Yashil)</span>
              <span class="flex items-center gap-1.5 text-red-400"><span class="w-2.5 h-2.5 rounded-full bg-red-500"></span> To'lamagan (Qizil)</span>
            </div>
          `}
        </div>

        <!-- Reyting jadvali -->
        <div class="p-6 rounded-2xl bg-cardbg border border-borderdark overflow-x-auto">
          <table class="w-full text-left border-collapse">
            <thead>
              <tr class="border-b border-borderdark text-xs uppercase text-slate-400">
                <th class="py-3.5 px-4">O'rin</th>
                <th class="py-3.5 px-4">O'quvchi (To'lov rangi)</th>
                <th class="py-3.5 px-4">Guruh</th>
                <th class="py-3.5 px-4">O'rtacha Baho</th>
                <th class="py-3.5 px-4">Davomat</th>
                <th class="py-3.5 px-4">To'lov (450 ming)</th>
                <th class="py-3.5 px-4 text-right">Reyting Ball</th>
              </tr>
            </thead>
            <tbody class="divide-y divide-borderdark text-sm">
              ${rankedList.map((s, idx) => {
                const rank = idx + 1;
                const isMe = me && s.id === me.id;
                let medal = `<span class="font-bold text-slate-400">#${rank}</span>`;
                if (rank === 1) medal = `<span class="inline-flex items-center justify-center w-7 h-7 rounded-lg bg-amber-500/20 text-amber-400 font-extrabold">🥇</span>`;
                if (rank === 2) medal = `<span class="inline-flex items-center justify-center w-7 h-7 rounded-lg bg-slate-400/20 text-slate-200 font-extrabold">🥈</span>`;
                if (rank === 3) medal = `<span class="inline-flex items-center justify-center w-7 h-7 rounded-lg bg-orange-600/20 text-orange-400 font-extrabold">🥉</span>`;

                // To'lov qilgan o'quvchi YASHIL, qilmagan QIZIL
                const rowColor = s.paid
                  ? 'bg-emerald-500/[0.08] hover:bg-emerald-500/[0.14]'
                  : 'bg-red-500/[0.08] hover:bg-red-500/[0.14]';
                const studentTextColor = s.paid ? 'text-emerald-400' : 'text-red-400';

                return `
                  <tr class="${rowColor} ${isMe ? 'ring-1 ring-inset ring-indigo-500' : ''} transition">
                    <td class="py-4 px-4">${medal}</td>
                    <td class="py-4 px-4">
                      <div class="flex items-center gap-2">
                        <span class="w-2.5 h-2.5 rounded-full ${s.paid ? 'bg-emerald-400' : 'bg-red-500'}"></span>
                        <span class="font-extrabold ${studentTextColor}">${s.name}</span>
                        ${isMe ? '<span class="px-2 py-0.5 rounded bg-indigo-600 text-white text-[10px] font-bold">SIZ</span>' : ''}
                      </div>
                    </td>
                    <td class="py-4 px-4 text-slate-300 text-xs">${getGroupName(s.groupId)}</td>
                    <td class="py-4 px-4 text-slate-200 font-semibold">${s.stats.avgGrade}</td>
                    <td class="py-4 px-4 text-slate-300">${s.stats.attRate}%</td>
                    <td class="py-4 px-4">
                      ${s.paid
                        ? '<span class="px-2.5 py-1 rounded-lg bg-emerald-500/20 text-emerald-300 text-xs font-bold">To\'langan</span>'
                        : '<span class="px-2.5 py-1 rounded-lg bg-red-500/20 text-red-300 text-xs font-bold">To\'lanmagan</span>'
                      }
                    </td>
                    <td class="py-4 px-4 text-right font-extrabold text-white text-base">${s.stats.ratingScore}</td>
                  </tr>
                `;
              }).join('')}
            </tbody>
          </table>
        </div>
      `;
    }

    function setRatingMode(mode) {
      ratingFilterMode = mode;
      if (mode === 'group' && ratingSelectedGroup === 'all') {
        const me = db.users.find(u => u.id === currentUser?.id);
        ratingSelectedGroup = (me && me.groupId) ? me.groupId : (db.groups[0]?.id || 'all');
      }
      renderActiveTab();
    }

    function changeRatingGroup(groupId) {
      ratingSelectedGroup = groupId;
      renderActiveTab();
    }
  </script>
</body>
</html>
